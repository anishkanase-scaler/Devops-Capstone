name: Petal Shop CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Test the backend and build the frontend. If anything fails, nothing gets built or pushed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Run backend tests (SQLite, from pytest.ini)
        run: pytest -v
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

  # 2. Build both Docker images, scan them with Trivy, then push them to GHCR tagged with the commit SHA.
  build-push:
    needs: test
    if: github.event_name == 'push'   # pull requests only run the tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/petal-shop-backend:${{ github.sha }} ./backend
          docker build -t ghcr.io/${{ github.repository_owner }}/petal-shop-frontend:${{ github.sha }} ./frontend

      # Security gate: fail the pipeline if either image has a fixable HIGH or CRITICAL CVE, so it never gets pushed.
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/petal-shop-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image with Trivy
        if: ${{ !cancelled() }}   # scan the frontend even when the backend scan already failed
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/petal-shop-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/petal-shop-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/petal-shop-frontend:${{ github.sha }}
