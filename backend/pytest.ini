[pytest]
pythonpath = .
testpaths = tests
# Tests always run on a throwaway SQLite file, never PostgreSQL. pytest-env sets this before
# the app is imported, and an environment variable overrides anything in backend/.env.
env =
    DATABASE_URL=sqlite:///./test.db
# Starlette's TestClient uses an alias that newer anyio deprecates; not our code.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
