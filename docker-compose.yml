services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: petal
      POSTGRES_USER: petal
      POSTGRES_PASSWORD: petal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petal -d petal"]
      interval: 3s
      retries: 10
    networks:
      - backend-net

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://petal:petal@postgres:5432/petal
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres is ready, not just started
    networks:
      - frontend-net
      - backend-net

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    networks:
      - frontend-net

networks:
  frontend-net:   # frontend <-> backend
    driver: bridge
  backend-net:    # backend <-> database
    driver: bridge

volumes:
  postgres-data:
