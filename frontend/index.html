<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Petal Shop</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="wrap header-in">
      <div class="logo">🌸 Petal Shop</div>
      <button class="btn" id="add-btn">+ Add product</button>
    </div>
  </header>

  <main class="wrap">
    <div class="error" id="error" hidden></div>

    <section class="stats">
      <div class="stat"><span id="stat-total">–</span>Products</div>
      <div class="stat"><span id="stat-stock">–</span>Items in stock</div>
      <div class="stat"><span id="stat-out">–</span>Sold out</div>
    </section>

    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"><p class="empty">Loading products…</p></div>
  </main>

  <dialog id="dialog">
    <form id="form" method="dialog">
      <h2 id="form-title">Add product</h2>
      <label>Name <input name="name" required maxlength="100" placeholder="Cherry Lip Gloss"></label>
      <div class="two">
        <label>Emoji <input name="emoji" maxlength="8" value="🎀"></label>
        <label>Category
          <select name="category">
            <option>Beauty</option><option>Accessories</option><option>Home</option><option>Stationery</option>
          </select>
        </label>
      </div>
      <div class="two">
        <label>Price (₹) <input name="price" type="number" min="0" required></label>
        <label>Stock <input name="stock" type="number" min="0" value="0" required></label>
      </div>
      <p class="error" id="form-error" hidden></p>
      <div class="actions">
        <button type="button" class="btn ghost" id="cancel">Cancel</button>
        <button type="submit" class="btn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
