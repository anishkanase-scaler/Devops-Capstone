server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # React app
  location / {
    try_files $uri /index.html;
  }

  # API calls go to the backend container ("backend" is the service name in docker-compose.yml)
  location /api/ {
    proxy_pass http://backend:8000;
  }

  location /health {
    proxy_pass http://backend:8000;
  }
}
