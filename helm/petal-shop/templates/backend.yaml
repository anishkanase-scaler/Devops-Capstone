apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}:{{ .Values.backend.tag }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: petal-shop-db
                  key: DATABASE_URL
          livenessProbe:            # is the process alive? (no database needed)
            httpGet:
              path: /health
              port: 8000
          readinessProbe:           # can it reach the database? only then send it traffic
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
---
# frontend/nginx.conf forwards /api to http://backend:8000
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
