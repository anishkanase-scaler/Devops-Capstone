apiVersion: v1
kind: ConfigMap
metadata:
  name: petal-shop-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  petal-shop.json: |
    {
      "title": "Petal Shop",
      "uid": "petal-shop",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Total requests",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "expr": "sum(http_requests_total{namespace=\"petal-shop\"})", "refId": "A" } ]
        },
        {
          "id": 2, "type": "stat", "title": "Backend pods being scraped",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "expr": "count(up{namespace=\"petal-shop\", service=\"backend\"} == 1)", "refId": "A" } ]
        },
        {
          "id": 3, "type": "timeseries", "title": "Requests per second by endpoint",
          "gridPos": { "x": 0, "y": 5, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "expr": "sum(rate(http_requests_total{namespace=\"petal-shop\"}[1m])) by (handler)", "legendFormat": "{{handler}}", "refId": "A" } ]
        },
        {
          "id": 4, "type": "timeseries", "title": "Responses by status (2xx / 4xx / 5xx)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "expr": "sum(rate(http_requests_total{namespace=\"petal-shop\"}[1m])) by (status)", "legendFormat": "{{status}}", "refId": "A" } ]
        },
        {
          "id": 5, "type": "timeseries", "title": "95th percentile latency (seconds)",
          "gridPos": { "x": 0, "y": 13, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"petal-shop\"}[1m])) by (le))", "legendFormat": "p95", "refId": "A" } ]
        }
      ]
    }
